name: Publish verified Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test application
        shell: pwsh
        run: |
          ./scripts/build.ps1
          pnpm package
          if ($LASTEXITCODE -ne 0) { throw 'Windows packages failed' }
          node scripts/verify-package.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged identity verification failed' }
      - name: Validate isolated installation and recovery
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          ./installer/inno/test.ps1 -PayloadDirectory release/win-unpacked -Version $version
          ./installer/inno/test-custom.ps1 -PayloadDirectory release/win-unpacked -Version $version
      - name: Publish and retain the latest version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git archive --format=zip --prefix=NetworkToolbox/ -o "release/NetworkToolbox-$version-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $files = @("release/NetworkToolbox-Setup-$version.exe", "release/NetworkToolbox-Setup-$version.exe.sha256", "release/NetworkToolbox-Setup-$version.exe.build.json", "release/NetworkToolbox-$version-windows-x64.zip", "release/NetworkToolbox-$version-Source.zip")
          ./scripts/publish-verified-release.ps1 -Version $version -Title "NetworkToolbox $version" -NotesFile "docs/releases/$version.md" -Files $files -KeepLatestOnly
